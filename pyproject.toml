    "faiss-cpu==1.7.4",
    "transformers>=4.30.0",
    "torch>=2.0.0",
    "numpy==1.24.3",
    "pandas==2.0.3",
    "requests==2.31.0",
    "python-dotenv==1.0.0",
    "tqdm==4.66.1",
    "scikit-learn==1.3.2",
    "jieba==0.42.1",
